services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vibe_php
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vibe_net

  nginx:
    image: nginx:1.25-alpine
    container_name: vibe_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Статика из PHP-образа: копируем через именованный том
      - public_data:/var/www/backend/public:ro
      # SSL-сертификаты (положите сюда Let's Encrypt или свои)
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
    networks:
      - vibe_net

  postgres:
    image: postgres:16-alpine
    container_name: vibe_postgres
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт НЕ открываем наружу в проде — только внутри сети
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibe_net

volumes:
  postgres_data:
  public_data:

networks:
  vibe_net:
    driver: bridge
