services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibe_php
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://vibe:vibe@postgres:5432/vibe?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailpit:1025"
      ADMIN_EMAIL: "support@vibe.local"
      COOKIE_SECURE: "false"
      INVITATIONS_ENABLED: "true"
    command: >
      sh -c "mkdir -p public/uploads/invitations
      && chmod -R 777 public/uploads var
      && php-fpm"
    networks:
      - vibe_net

  nginx:
    image: nginx:1.25-alpine
    container_name: vibe_nginx
    ports:
      - "8084:80"
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - vibe_net
    # Ждём появления Symfony public/index.php перед стартом nginx
    command: >
      sh -c "while [ ! -f /var/www/backend/public/index.php ]; do
        echo 'Waiting for Symfony public/...'; sleep 2;
      done && nginx -g 'daemon off;'"

  postgres:
    image: postgres:16-alpine
    container_name: vibe_postgres
    environment:
      POSTGRES_DB: vibe
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibe_net

  # Локальный SMTP — письма видны по http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: vibe_mailpit
    ports:
      - "8026:8025"  # веб-интерфейс
      - "1026:1025"  # SMTP
    networks:
      - vibe_net

volumes:
  postgres_data:

networks:
  vibe_net:
    driver: bridge
